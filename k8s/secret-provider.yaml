# Requires the Secrets Store CSI driver installed first:
#   helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#   helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#     --namespace kube-system --set syncSecret.enabled=true
#
# And the AWS provider:
#   kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml
#
# Create the secret in AWS Secrets Manager first:
#   aws secretsmanager create-secret \
#     --name prod/api/database-url \
#     --secret-string '{"DATABASE_URL":"postgres://user:pass@host:5432/db"}' \
#     --region eu-west-1

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-secrets
  namespace: production
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "prod/api/database-url"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
  # Syncs the fetched secret as a Kubernetes Secret so pods can use it as an env var
  secretObjects:
  - secretName: api-secrets
    type: Opaque
    data:
    - objectName: DATABASE_URL
      key: DATABASE_URL
