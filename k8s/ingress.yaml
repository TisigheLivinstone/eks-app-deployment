apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: alb
    # internet-facing = public ALB; internal = private ALB (within VPC only)
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip mode routes directly to pod IPs — required when using the VPC CNI
    alb.ingress.kubernetes.io/target-type: ip
    # HTTPS only — redirect HTTP to HTTPS handled at ALB level
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # Replace with your ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: YOUR_ACM_CERT_ARN
    # ALB checks this path before routing traffic to a pod
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  rules:
  - host: api.yourdomain.com    # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-api       # Matches the Helm release name (api) + service template
            port:
              number: 3000
