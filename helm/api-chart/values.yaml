replicaCount: 2

image:
  # Replace with your ECR repository URI
  repository: 506456084401.dkr.ecr.eu-west-1.amazonaws.com/api
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Readiness probe — blocks traffic until the app is genuinely ready
readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

# Liveness probe — restarts the container if it stops responding
livenessProbe:
  httpGet:
    path: /healthz/live
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

env:
  NODE_ENV: production
