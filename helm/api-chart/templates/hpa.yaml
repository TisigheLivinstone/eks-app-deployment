{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.hpa.targetCPUUtilization }}
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down — prevents flapping under variable load
      stabilizationWindowSeconds: 300
    scaleUp:
      # Scale up within 30 seconds of sustained high CPU
      stabilizationWindowSeconds: 30
{{- end }}
